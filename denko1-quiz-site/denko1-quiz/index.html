<title>電工一種 過去問ランダム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: 1 column study sheet. Exam image sits on a paper card; answer keys 4-up below; settings in a collapsible panel. */
:root{
  --bg:#eef1f3; --panel:#ffffff; --fg:#1b2428; --muted:#5d6b73; --line:#cfd8dd;
  --accent:#16507d; --accent-fg:#ffffff;
  --ok:#17703f; --ok-bg:#e0f3e8; --ng:#b3261e; --ng-bg:#fbe5e3;
  --paper:#ffffff; --paper-line:#c9d1d6;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181c; --panel:#1b242a; --fg:#e6ecef; --muted:#9aa9b1; --line:#2f3d45;
  --accent:#6fb1e6; --accent-fg:#0d1a24;
  --ok:#5fd193; --ok-bg:#16352a; --ng:#ff8a80; --ng-bg:#3d1f1d;
  --paper-line:#3a4850; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12181c; --panel:#1b242a; --fg:#e6ecef; --muted:#9aa9b1; --line:#2f3d45;
  --accent:#6fb1e6; --accent-fg:#0d1a24;
  --ok:#5fd193; --ok-bg:#16352a; --ng:#ff8a80; --ng-bg:#3d1f1d;
  --paper-line:#3a4850; color-scheme:dark;}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:880px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-size:1.25rem;margin:0;font-weight:700;text-wrap:balance}
.score{font-family:var(--f-num);font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--fg);font-weight:500}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px;font-size:.9rem}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted);font-size:.82rem}
.qno{font-family:var(--f-num);font-weight:500;font-size:1rem}
.paper{background:var(--paper);border:1px solid var(--paper-line);border-radius:4px;padding:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.zoombar{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.zoombar .zb{font:inherit;font-size:.85rem;padding:3px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;min-height:32px}
.zoombar .zb[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.paper canvas{display:block;height:auto;background:#fff;max-width:none}
.figbox{margin-top:12px}
.figbox summary{cursor:pointer;font-weight:700;color:var(--accent);padding:6px 0}
.figbox img{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--paper-line);border-radius:4px;cursor:zoom-in}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.key{font:inherit;font-size:1.35rem;font-weight:700;padding:14px 0;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;min-height:56px}
.key small{display:block;font-family:var(--f-num);font-size:.7rem;font-weight:500;color:var(--muted);line-height:1}
.key:hover:not(:disabled){border-color:var(--accent)}
.key:focus-visible,.btn:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.key:disabled{cursor:default}
.key.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.key.wrong{border-color:var(--ng);background:var(--ng-bg);color:var(--ng)}
.result{margin-top:14px;border-radius:8px;padding:12px 14px;font-weight:700;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.result.ok{background:var(--ok-bg);color:var(--ok)}
.result.ng{background:var(--ng-bg);color:var(--ng)}
.result .ans{font-size:1.15rem}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 20px;background:var(--accent);color:var(--accent-fg);cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 12px;min-height:34px;font-size:.88rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
.settings summary{cursor:pointer;font-weight:700}
.settings .grid{display:grid;gap:14px;margin-top:12px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-size:.85rem;color:var(--muted);padding:0;margin-bottom:6px;letter-spacing:.04em}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px}
.opts label{display:flex;align-items:center;gap:6px;font-size:.92rem;cursor:pointer}
.exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px}
.exams label{display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{color:var(--muted);font-size:.85rem;margin:0}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:10;display:flex;flex-direction:column}
#lb .bar{display:flex;justify-content:flex-end;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
#lb .scroll{flex:1;overflow:auto;padding:0 8px 20px;-webkit-overflow-scrolling:touch}
#lb img{display:block;width:260%;max-width:none;background:#fff;margin:0 auto}
@media (min-width:700px){#lb img{width:auto;max-width:none;min-width:100%}}
@media (prefers-reduced-motion:no-preference){.key,.btn{transition:background .12s,border-color .12s}}
</style>

<div class="wrap">
  <header>
    <h1>電工一種 過去問ランダム</h1>
    <div class="score" id="score" aria-live="polite"></div>
  </header>

  <details class="card settings" id="settings">
    <summary>出題範囲を選ぶ</summary>
    <div class="grid">
      <fieldset>
        <legend>問題の種類</legend>
        <div class="opts">
          <label><input type="radio" name="cat" value="all" checked> すべて（問1〜50）</label>
          <label><input type="radio" name="cat" value="gen"> 一般問題（問1〜40）</label>
          <label><input type="radio" name="cat" value="wire"> 配線図（問41〜50）</label>
          <label><input type="radio" name="cat" value="fig"> 図つき（問30〜34・41〜50）</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>出題する回</legend>
        <div class="row" style="margin-bottom:8px">
          <button class="btn ghost small" type="button" id="allOn">すべて選択</button>
          <button class="btn ghost small" type="button" id="allOff">すべて解除</button>
        </div>
        <div class="exams" id="exams"></div>
      </fieldset>
      <fieldset>
        <legend>モード</legend>
        <div class="opts">
          <label><input type="radio" name="mode" value="rand" checked> ランダム</label>
          <label><input type="radio" name="mode" value="wrong"> 間違えた問題だけ復習</label>
        </div>
      </fieldset>
      <div class="row">
        <button class="btn" type="button" id="apply">この条件で始める</button>
        <button class="btn ghost" type="button" id="reset">成績をリセット</button>
        <span class="note" id="poolinfo"></span>
      </div>
    </div>
  </details>

  <section class="card" id="quiz" aria-live="off"></section>
</div>

<div id="lb" hidden>
  <div class="bar"><button class="btn" id="lbclose" type="button">閉じる</button></div>
  <div class="scroll"><img id="lbimg" alt="図の拡大"></div>
</div>

const LETTERS=['イ','ロ','ハ','ニ'];
const KEY='denko1-progress-v1';
let stats={answered:0,correct:0,wrong:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object'){stats={answered:s.answered|0,correct:s.correct|0,wrong:s.wrong||{}}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(stats))}catch(e){}}

const all=[];
DATA.forEach(e=>e.q.forEach(q=>all.push({id:e.id+'-'+q.n,exam:e,q})));
const $=s=>document.querySelector(s);
const examBox=$('#exams');
DATA.forEach(e=>{
  const l=document.createElement('label');
  l.innerHTML='<input type="checkbox" checked value="'+e.id+'"> <span>'+e.label+'</span>';
  examBox.appendChild(l);
});
$('#allOn').onclick=()=>examBox.querySelectorAll('input').forEach(i=>i.checked=true);
$('#allOff').onclick=()=>examBox.querySelectorAll('input').forEach(i=>i.checked=false);

const imgs={};
function loadImg(src){
  if(!imgs[src]){imgs[src]=new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
  return imgs[src];
}
function cat(n){return n>=41?'wire':'gen'}
function inCat(item,c){
  const n=item.q.n;
  if(c==='all')return true;
  if(c==='gen')return n<=40;
  if(c==='wire')return n>=41;
  if(c==='fig')return !!item.q.fig;
  return true;
}
const ZK='denko1-zoom';
let zoom=null;try{zoom=localStorage.getItem(ZK)}catch(e){}
if(!['fit','m','l'].includes(zoom))zoom='fit';
function applyZoom(){
  const cv=$('#cv');if(!cv||!cur)return;
  const w=cur.q.w;
  cv.style.width=zoom==='fit'?'100%':zoom==='m'?Math.round(w*0.72)+'px':w+'px';
  document.querySelectorAll('.zb').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.z===zoom)));
}
let pool=[],order=[],pos=0,cur=null,answered=false,mode='rand';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildPool(){
  const c=document.querySelector('input[name=cat]:checked').value;
  mode=document.querySelector('input[name=mode]:checked').value;
  const ex=new Set([...examBox.querySelectorAll('input:checked')].map(i=>i.value));
  pool=all.filter(it=>ex.has(it.exam.id)&&inCat(it,c)&&(mode==='rand'||stats.wrong[it.id]));
  order=shuffle(pool.map((_,i)=>i));pos=0;
  $('#poolinfo').textContent='出題対象 '+pool.length+' 問';
}
function renderScore(){
  const r=stats.answered?Math.round(stats.correct/stats.answered*100):0;
  const w=Object.keys(stats.wrong).length;
  $('#score').innerHTML='正解 <b>'+stats.correct+'</b> / 回答 <b>'+stats.answered+'</b>（'+r+'%）· 要復習 <b>'+w+'</b>';
}
function next(){
  const box=$('#quiz');
  if(!pool.length){
    box.innerHTML='<div class="empty">'+(mode==='wrong'?'間違えた問題はまだありません。ランダムモードで解いてみましょう。':'条件に合う問題がありません。出題範囲を見直してください。')+'</div>';
    return;
  }
  if(pos>=order.length){shuffle(order);pos=0}
  cur=pool[order[pos++]];answered=false;
  const {exam,q}=cur;
  const fig=q.fig?exam.figs[q.fig]:null;
  box.innerHTML=
   '<div class="meta"><span class="qno">問'+q.n+'</span><span class="tag">'+exam.label+'</span><span class="tag">'+(q.n>=41?'配線図':'一般問題')+'</span></div>'+
   '<div class="zoombar" role="group" aria-label="表示サイズ"><span class="note">表示サイズ</span><button class="zb" type="button" data-z="fit">画面幅</button><button class="zb" type="button" data-z="m">中</button><button class="zb" type="button" data-z="l">大</button></div>'+(innerWidth<700?'<p class="note" style="margin:0 0 8px">文字が小さいときは「中」「大」で拡大（横にスクロール）、または画面幅のまま問題をタップすると拡大表示します。</p>':'')+'<div class="paper" id="paper"><canvas id="cv" width="'+q.w+'" height="'+q.h+'" role="img" aria-label="問題'+q.n+'"></canvas></div>'+
   (fig?'<details class="figbox" open><summary>この問題の図（タップで拡大）</summary><img id="fig" src="'+fig.f+'" width="'+fig.w+'" height="'+fig.h+'" alt="問'+q.n+'の図"></details>':'')+
   '<div class="keys" id="keys">'+LETTERS.map((l,i)=>'<button class="key" type="button" data-i="'+i+'"><small>'+(i+1)+'</small>'+l+'</button>').join('')+'</div>'+
   '<div id="res"></div><div class="actions" id="act"></div>';
  loadImg(exam.sheets[q.s]).then(im=>{
    const cv=$('#cv');if(!cv)return;
    cv.getContext('2d').drawImage(im,0,q.y,q.w,q.h,0,0,q.w,q.h);
  }).catch(()=>{$('#cv').insertAdjacentHTML('afterend','<p class="note">画像を読み込めませんでした。</p>')});
  const f=$('#fig');if(f)f.onclick=()=>openLb(f.src);
  box.querySelectorAll('.zb').forEach(b=>b.onclick=()=>{zoom=b.dataset.z;try{localStorage.setItem(ZK,zoom)}catch(e){}applyZoom()});
  $('#paper').onclick=()=>{if(zoom==='fit'&&innerWidth<700){try{openLb($('#cv').toDataURL('image/png'))}catch(e){}}};
  applyZoom();
  box.querySelectorAll('.key').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  // warm next sheet
  const nx=pool[order[pos%order.length]];if(nx)loadImg(nx.exam.sheets[nx.q.s]).catch(()=>{});
}
function choose(i){
  if(answered||!cur)return;
  answered=true;
  const {q}=cur,ok=i===q.a;
  stats.answered++;
  if(ok){stats.correct++;if(mode==='wrong')delete stats.wrong[cur.id]}else{stats.wrong[cur.id]=1}
  save();renderScore();
  const keys=document.querySelectorAll('.key');
  keys.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
  $('#res').innerHTML='<div class="result '+(ok?'ok':'ng')+'" role="status"><span>'+(ok?'⭕ 正解です':'❌ 不正解です')+'</span><span class="ans">正解は「'+LETTERS[q.a]+'」'+(ok?'':'（あなたの回答：'+LETTERS[i]+'）')+'</span></div>';
  $('#act').innerHTML='<button class="btn" id="nextbtn" type="button">次の問題</button>';
  const nb=$('#nextbtn');nb.onclick=next;nb.focus({preventScroll:true});
}
function openLb(src){$('#lbimg').src=src;$('#lb').hidden=false}
$('#lbclose').onclick=()=>{$('#lb').hidden=true};
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')$('#lb').hidden=true});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea'))return;
  if(e.key==='Escape'&&!$('#lb').hidden){$('#lb').hidden=true;return}
  if(e.key>='1'&&e.key<='4'){choose(+e.key-1)}
  else if((e.key==='Enter'||e.key===' ')&&answered&&e.target.tagName!=='BUTTON'){e.preventDefault();next()}
});
$('#apply').onclick=()=>{buildPool();$('#settings').open=false;next()};
$('#reset').onclick=()=>{stats={answered:0,correct:0,wrong:{}};save();renderScore();buildPool()};
renderScore();buildPool();next();
</script>
